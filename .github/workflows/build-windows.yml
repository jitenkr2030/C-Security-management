name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.3'
        arch: 'win64_msvc2019_64'
        modules: 'qt5compat'

    - name: Clean build
      run: |
        if (Test-Path build) { Remove-Item -Recurse -Force build }
        mkdir build
      shell: pwsh

    - name: Configure CMake
      run: |
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
      shell: cmd

    - name: Build
      run: |
        cd build
        cmake --build . --config Release -j 4
      shell: cmd

    - name: Create distribution
      run: |
        if (Test-Path dist) { Remove-Item -Recurse -Force dist }
        mkdir dist
        copy build\Release\SecurityGuardManager.exe dist\
        cd dist
        windeployqt SecurityGuardManager.exe --no-translations --no-opengl-sw --no-system-d3d-compiler
        del /q *.qml 2>nul
      shell: cmd

    - name: Upload artifact
      uses: actions/upload-artifact@v5
      with:
        name: SecurityGuardManager-Windows
        path: dist/
        retention-days: 30
