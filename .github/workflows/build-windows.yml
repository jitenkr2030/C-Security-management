name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.3'
        arch: 'win64_msvc2019_64'
        modules: 'qtsql'

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd build
        cmake --build . --config Release -j 4

    - name: Create distribution package
      run: |
        mkdir dist
        copy build\Release\SecurityGuardManager.exe dist\

        # Copy Qt DLLs
        cd dist
        windeployqt SecurityGuardManager.exe --no-translations --no-opengl-sw --no-system-d3d-compiler

        # Remove unnecessary files
        rmdir /s /q generic 2>nul
        rmdir /s /q imageformats 2>nul
        rmdir /s /q networkinformation 2>nul
        rmdir /s /q tls 2>nul
        del /q *.qml 2>nul
        del /q vc_redist.x64.exe 2>nul

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: SecurityGuardManager-Windows
        path: dist/
        retention-days: 30
